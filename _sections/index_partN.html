<script>
/* ═══════════════════════════════════════════════════════════════
   PART N — Historique & Connexions
═══════════════════════════════════════════════════════════════ */

/* ═══ HISTORIQUE (audit log) ═══════════════════════════════ */
function renderHistorique() {
  el('content').innerHTML = buildSkeletonTable(6);
  google.script.run
    .withSuccessHandler(paintHistorique)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listAuditLogs(S.token, { limit: 200 });
}

function paintHistorique(rows) {
  rows = rows || [];
  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<span class="fw8">Historique des actions</span>';
  html += '<span class="chip t-muted">' + rows.length + ' entrées</span>';
  html += '</div>';

  if (!rows.length) {
    html += '<div class="empty">Aucun enregistrement.</div></div>';
    el('content').innerHTML = html;
    return;
  }

  html += buildTable(
    ['Date', 'Utilisateur', 'Action', 'Module', 'ID entité', 'Détail'],
    rows,
    function(r) {
      var actionTone = {
        CREATE:   'cp',
        UPDATE:   'cw',
        DELETE:   'cd',
        LOGIN:    'cs',
        LOGOUT:   '',
        OVERRIDE: 'cg'
      }[r.action] || '';
      return '<tr>' +
        '<td class="fs-sm t-muted">' + fmtDateTime(r.timestamp) + '</td>' +
        '<td class="fw7">' + escHtml(r.user_name || r.user_id || '—') + '</td>' +
        '<td><span class="chip ' + actionTone + '">' + escHtml(r.action || '—') + '</span></td>' +
        '<td class="fs-sm">' + escHtml(r.entity_type || '—') + '</td>' +
        '<td class="fs-xs t-muted" style="font-family:monospace;">' + escHtml(r.entity_id || '—') + '</td>' +
        '<td class="fs-sm t-muted">' + escHtml(r.description || '—') + '</td>' +
        '</tr>';
    }
  );

  html += '</div>';
  el('content').innerHTML = html;
}

/* ═══ RECHERCHE GLOBALE ══════════════════════════════════════ */
var _gsTimer = null;

/* Recherche immédiate (bouton / Enter) */
function triggerGlobalSearch() {
  var input   = el('global-search-input');
  var results = el('global-search-results');
  if (!input) return;
  var q = input.value.trim();
  clearTimeout(_gsTimer);
  if (q.length < 1) {
    if (results) { results.innerHTML = ''; results.classList.add('hidden'); }
    return;
  }
  if (results) {
    results.innerHTML = '<div style="padding:10px 14px;font-size:.82rem;color:var(--text-soft);">Recherche en cours…</div>';
    results.classList.remove('hidden');
  }
  google.script.run
    .withSuccessHandler(paintGlobalSearchResults)
    .withFailureHandler(function(e) {
      var res = el('global-search-results');
      if (res) {
        res.innerHTML = '<div style="padding:10px 14px;font-size:.82rem;color:var(--danger);">Erreur : ' + escHtml((e && e.message) || 'Recherche impossible') + '</div>';
        res.classList.remove('hidden');
      }
    })
    .globalSearch(S.token, q, []);
}

var _GS_MODULES = {
  agrement:    { label: 'Agrément',    view: 'agrements'    },
  sinistre:    { label: 'Sinistre',    view: 'sinistres'    },
  facture:     { label: 'Facture',     view: 'factures'     },
  resiliation: { label: 'Résiliation', view: 'resiliations' }
};

function onGlobalSearchInput() {
  var input   = el('global-search-input');
  var results = el('global-search-results');
  var q       = input ? input.value.trim() : '';

  clearTimeout(_gsTimer);

  if (q.length < 2) {
    if (results) { results.innerHTML = ''; results.classList.add('hidden'); }
    return;
  }

  _gsTimer = setTimeout(function() {
    google.script.run
      .withSuccessHandler(paintGlobalSearchResults)
      .withFailureHandler(function(e) {
        var res = el('global-search-results');
        if (res) {
          res.innerHTML = '<div style="padding:10px 14px;font-size:.82rem;color:var(--danger);">Erreur : ' + escHtml((e && e.message) || 'Recherche impossible') + '</div>';
          res.classList.remove('hidden');
        }
      })
      .globalSearch(S.token, q, []);
  }, 350);
}

function paintGlobalSearchResults(items) {
  var results = el('global-search-results');
  if (!results) return;
  items = items || [];

  if (!items.length) {
    results.innerHTML = '<div style="padding:12px 16px;font-size:.84rem;color:var(--text-soft);">Aucun résultat.</div>';
    results.classList.remove('hidden');
    return;
  }

  results.innerHTML = items.map(function(item) {
    var mod = _GS_MODULES[item.module] || { label: item.module };
    return '<div class="gs-result"' +
      ' onclick="onGlobalSearchClick(\'' + item.module + '\',\'' + item.id + '\')"' +
      ' onmouseover="this.style.background=\'var(--glass)\'"' +
      ' onmouseout="this.style.background=\'\'"' +
      ' style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background var(--t-fast);">' +
      '<span class="chip" style="flex-shrink:0;font-size:.72rem;white-space:nowrap;">' + escHtml(mod.label) + '</span>' +
      '<div style="min-width:0;flex:1;">' +
        '<div style="font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold);">' +
          escHtml(item.reference) +
          (item.label && item.label !== item.reference ? '<span style="font-weight:400;color:var(--text);"> — ' + escHtml(item.label) + '</span>' : '') +
        '</div>' +
        '<div style="font-size:.76rem;color:var(--text-soft);margin-top:2px;">' + statusChip(item.statut) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  results.classList.remove('hidden');
}

function onGlobalSearchClick(module, id) {
  /* Fermer le dropdown et vider l'input */
  var results = el('global-search-results');
  var input   = el('global-search-input');
  if (results) { results.innerHTML = ''; results.classList.add('hidden'); }
  if (input)   input.value = '';

  var mod = _GS_MODULES[module];
  if (!mod) return;

  /* Naviguer vers la vue du module */
  navigate(mod.view);

  /* Ouvrir le modal dès que les données sont chargées */
  var tries = 0;
  var check = setInterval(function() {
    tries++;
    var found = false;
    if (module === 'agrement'    && _agrements.find(function(r){ return r.id === id; }))    { openAgrementModal(id);    found = true; }
    if (module === 'sinistre'    && _sinistres.find(function(r){ return r.id === id; }))    { openSinistreModal(id);    found = true; }
    if (module === 'facture'     && _factures.find(function(r){ return r.id === id; }))     { openFactureModal(id);     found = true; }
    if (module === 'resiliation' && _resiliations.find(function(r){ return r.id === id; })) { openResiliationModal(id); found = true; }
    if (found || tries > 30) clearInterval(check);
  }, 200);
}

/* Fermer dropdown si clic en dehors */
document.addEventListener('click', function(e) {
  var wrap = el('global-search-wrap');
  if (wrap && !wrap.contains(e.target)) {
    var res = el('global-search-results');
    if (res) { res.innerHTML = ''; res.classList.add('hidden'); }
  }
});

/* Fermer dropdown sur ESC */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var res = el('global-search-results');
    if (res && !res.classList.contains('hidden')) {
      res.innerHTML = '';
      res.classList.add('hidden');
      var input = el('global-search-input');
      if (input) input.value = '';
    }
  }
});

/* ═══ CONNEXIONS ════════════════════════════════════════════ */
function renderConnexions() {
  el('content').innerHTML = buildSkeletonTable(6);
  google.script.run
    .withSuccessHandler(paintConnexions)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listSessions(S.token, { limit: 150 });
}

function paintConnexions(rows) {
  rows = rows || [];
  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<span class="fw8">Journaux de connexion</span>';
  html += '<span class="chip t-muted">' + rows.length + ' entrées</span>';
  html += '</div>';

  if (!rows.length) {
    html += '<div class="empty">Aucun journal.</div></div>';
    el('content').innerHTML = html;
    return;
  }

  html += buildTable(
    ['Utilisateur', 'Rôle', 'Connexion', 'Déconnexion', 'Durée', 'IP / Agent'],
    rows,
    function(r) {
      var duration = '';
      if (r.connected_at && r.disconnected_at) {
        var ms = new Date(r.disconnected_at) - new Date(r.connected_at);
        duration = fmtDuration(Math.round(ms / 1000));
      }
      return '<tr>' +
        '<td class="fw7">' + escHtml(r.user_name || r.user_id || '—') + '</td>' +
        '<td class="fs-sm">' + escHtml(r.role || '—') + '</td>' +
        '<td class="fs-sm">' + fmtDateTime(r.connected_at) + '</td>' +
        '<td class="fs-sm t-muted">' + (r.disconnected_at ? fmtDateTime(r.disconnected_at) : '<span class="online-badge on" style="font-size:.72rem;">Actif</span>') + '</td>' +
        '<td class="fs-sm">' + (duration || '—') + '</td>' +
        '<td class="fs-xs t-muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(r.user_agent || r.ip || '—') + '</td>' +
        '</tr>';
    }
  );

  html += '</div>';
  el('content').innerHTML = html;
}
</script>
