<script>
/* ═══════════════════════════════════════════════════════════════
   PART M — Présence & Export
═══════════════════════════════════════════════════════════════ */

function renderPresence() {
  el('content').innerHTML = buildSkeletonTable(5);
  var today = todayKey();
  google.script.run
    .withSuccessHandler(function(data) { paintPresence(data, today); })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .getPresenceSummary(S.token, today);
}

function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function paintPresence(data, dateKey) {
  data = data || {};
  var rows = data.rows || [];

  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<div>';
  html += '<span class="fw8">Présence</span>';
  html += '<div class="t-muted fs-sm" style="margin-top:3px;">Date : ' + escHtml(dateKey) + '</div>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;align-items:center;">';
  html += '<input type="date" id="pres-date" value="' + escHtml(dateKey) + '" style="min-height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;font:inherit;font-size:.86rem;background:var(--glass);color:var(--text);outline:none;" onchange="loadPresenceDate(this.value)">';
  html += '<button class="b2 fs-sm" style="min-height:36px;padding:0 14px;" onclick="exportPresence()">⬇ Export CSV</button>';
  html += '</div></div>';

  /* Résumé KPIs */
  html += '<div class="kpis" style="margin-bottom:14px;">';
  html += '<div class="kpi"><div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Utilisateurs</div><div class="v-sm">' + (data.total_users || 0) + '</div></div>';
  html += '<div class="kpi"><div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">En ligne</div><div class="v-sm">' + (data.online_now || 0) + '</div></div>';
  html += '<div class="kpi"><div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Connexions</div><div class="v-sm">' + (data.total_connections || 0) + '</div></div>';
  html += '<div class="kpi"><div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Déconnexions</div><div class="v-sm">' + (data.total_disconnections || 0) + '</div></div>';
  html += '<div class="kpi"><div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Temps total</div><div class="v-sm">' + fmtDuration(data.total_online_seconds || 0) + '</div></div>';
  html += '</div>';

  /* Table présence */
  html += buildTable(
    ['Utilisateur', 'Rôle', 'Statut', 'Connexions', 'Déconnexions', 'Temps en ligne'],
    rows,
    function(r) {
      var isOnline = r.is_online;
      return '<tr>' +
        '<td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar" style="width:28px;height:28px;font-size:.72rem;">' + initials(r.full_name || r.user_id) + '</div>' + escHtml(r.full_name || r.user_id) + '</div></td>' +
        '<td class="fs-sm">' + escHtml(r.role || '—') + '</td>' +
        '<td>' + (isOnline
          ? '<span class="online-badge on">En ligne</span>'
          : '<span class="online-badge off">Hors ligne</span>') + '</td>' +
        '<td>' + (r.connections || 0) + '</td>' +
        '<td>' + (r.disconnections || 0) + '</td>' +
        '<td class="fw7">' + fmtDuration(r.total_online_seconds) + '</td>' +
        '</tr>';
    }
  );

  html += '</div>';
  el('content').innerHTML = html;
}

function loadPresenceDate(dateKey) {
  el('content').innerHTML = buildSkeletonTable(4);
  google.script.run
    .withSuccessHandler(function(data) { paintPresence(data, dateKey); })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .getPresenceSummary(S.token, dateKey);
}

function exportPresence() {
  var dateEl = el('pres-date');
  var dateKey = dateEl ? dateEl.value : todayKey();
  google.script.run
    .withSuccessHandler(function(data) {
      var rows = (data && data.rows) ? data.rows : [];
      if (!rows.length) { toast('Aucune donnée à exporter.', 'info'); return; }
      var csv = 'Utilisateur,Rôle,Statut,Connexions,Déconnexions,Temps en ligne (s)\n';
      rows.forEach(function(r) {
        csv += [
          '"' + (r.full_name || r.user_id || '') + '"',
          '"' + (r.role || '') + '"',
          r.is_online ? 'En ligne' : 'Hors ligne',
          r.connections || 0,
          r.disconnections || 0,
          r.total_online_seconds || 0
        ].join(',') + '\n';
      });
      downloadCsv('presence_' + dateKey + '.csv', csv);
    })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .getPresenceSummary(S.token, dateKey);
}

function downloadCsv(filename, content) {
  var blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
</script>
