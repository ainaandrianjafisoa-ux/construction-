<script>
/* ═══════════════════════════════════════════════════════════════
   PART K — Module Facture (Vérification / Calcul / Règlement)
═══════════════════════════════════════════════════════════════ */

var _factures   = [];
var _mfaCurrent = null;

/* Étapes — alignées sur le schéma backend */
var FACTURE_STEPS = [
  { key: 'etape_verification', label: 'Vérification' },
  { key: 'etape_calcul',       label: 'Calcul'       },
  { key: 'etape_reglement',    label: 'Règlement'    }
];

/* ── List ─────────────────────────────────────────────────── */
function renderFactures() {
  el('content').innerHTML = buildSkeletonTable(5);
  google.script.run
    .withSuccessHandler(paintFactures)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listFactures(S.token, {});
}

function paintFactures(rows) {
  _factures = rows || [];
  var perms = S.permissions || {};

  var html = '<div class="card">';
  html += '<div class="card-head"><span class="fw8">Factures</span>';
  html += '<div style="display:flex;gap:8px;align-items:center;">';
  html += '<input type="text" id="fa-search" placeholder="Recherche…" class="filter-input" oninput="filterFactures()">';
  html += '<select id="fa-filter-statut" class="filter-select" onchange="filterFactures()"><option value="">Tous statuts</option>';
  ['En cours','Remonté','Vérifié','Traité'].forEach(function(s){ html += '<option>' + s + '</option>'; });
  html += '</select>';
  html += '<button class="b1" onclick="openFactureModal(null)">+ Nouvelle</button>';
  html += '</div></div>';
  html += '<div id="fa-table-wrap"></div></div>';
  el('content').innerHTML = html;
  paintFacturesTable(_factures);
}

function filterFactures() {
  var search = el('fa-search') ? el('fa-search').value.toLowerCase() : '';
  var statut = el('fa-filter-statut') ? el('fa-filter-statut').value : '';
  paintFacturesTable(_factures.filter(function(r) {
    return (!statut || r.statut === statut) &&
           (!search || JSON.stringify(r).toLowerCase().indexOf(search) > -1);
  }));
}

function paintFacturesTable(rows) {
  var wrap = el('fa-table-wrap');
  if (!wrap) return;
  if (!rows.length) { wrap.innerHTML = '<div class="empty">Aucune facture.</div>'; return; }

  wrap.innerHTML = buildTable(
    ['Référence', 'N° sinistre', 'Étapes', 'Statut', 'Vérifié TL', 'Modifié', 'Actions'],
    rows,
    function(r) {
      var done  = FACTURE_STEPS.filter(function(s){ return String(r[s.key]) === 'TRUE'; }).length;
      var total = FACTURE_STEPS.length;
      var progressHtml =
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<div class="stat-bar" style="width:70px;"><div class="stat-bar-fill" style="width:' + Math.round(done/total*100) + '%"></div></div>' +
          '<span class="fs-xs t-muted">' + done + '/' + total + '</span>' +
        '</div>';

      var statutCell = statusChip(r.statut);
      var verifCell  = r.verifie_badge === 'TRUE' || r.verifie_badge === true
        ? '<span class="badge-verified">✔ TL</span>'
        : '<span class="t-muted fs-xs">—</span>';

      return '<tr' + (r.statut === 'Vérifié' ? ' style="background:rgba(201,168,76,.04);"' : '') + '>' +
        '<td class="fw7 t-gold">' + escHtml(r.reference || '—') + '</td>' +
        '<td class="fs-sm fw7">' + escHtml(r.no_sinistre || '—') + '</td>' +
        '<td>' + progressHtml + '</td>' +
        '<td>' + statutCell + '</td>' +
        '<td>' + verifCell + '</td>' +
        '<td class="fs-sm t-muted">' + fmtDate(r.updated_at) + '</td>' +
        '<td><button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openFactureModal(\'' + r.id + '\')">✎</button></td>' +
        '</tr>';
    }
  );
}

/* ── Open modal ──────────────────────────────────────────── */
function openFactureModal(facId) {
  _mfaCurrent = facId ? (_factures.find(function(x){ return x.id === facId; }) || null) : null;
  var r     = _mfaCurrent || {};
  var perms = S.permissions || {};

  el('mfa-title').textContent    = facId ? 'Modifier facture' : 'Nouvelle facture';
  el('mfa-ref').textContent      = r.reference || '';
  el('mfa-no-sinistre').value    = r.no_sinistre || '';
  el('mfa-commentaire').value    = r.commentaire_traitement || '';

  var traiterZone = el('mfa-traiter-zone');

  if (facId) {
    traiterZone.classList.remove('hidden');

    /* Badge vérifié */
    var vStrip = el('mfa-verified-strip');
    var isVerif = r.verifie_badge === 'TRUE' || r.verifie_badge === true;
    if (vStrip) {
      vStrip.classList.toggle('hidden', !isVerif);
      var vPar = el('mfa-verifie-par');
      if (vPar) vPar.textContent = r.verifie_par ? 'par ' + r.verifie_par : '';
    }

    /* Remontée strip */
    var rStrip = el('mfa-remonte-strip');
    if (rStrip) rStrip.classList.toggle('hidden', r.statut !== 'Remonté');

    /* Steps */
    buildFactureSteps(r);

    /* Bouton Vérifier TL */
    var btnVer = el('btn-mfa-verifier');
    if (btnVer) {
      if (perms.canVerifierFactures && r.statut === 'Remonté') {
        btnVer.style.display = '';
        btnVer.onclick = function() { doVerifierFacture(facId); };
      } else {
        btnVer.style.display = 'none';
      }
    }

    el('btn-mfa-traiter').onclick = function() { doTraiterFacture(facId); };
  } else {
    traiterZone.classList.add('hidden');
  }

  el('btn-mfa-save').onclick = saveFactureModal;
  openModal('modal-facture');
}

function buildFactureSteps(r) {
  var stepsEl = el('mfa-steps');
  if (!stepsEl) return;
  stepsEl.innerHTML = '';
  FACTURE_STEPS.forEach(function(step) {
    var done = String(r[step.key]) === 'TRUE';
    var row  = document.createElement('div');
    row.className = 'step-row' + (done ? ' done' : '');

    var cb = document.createElement('input');
    cb.type    = 'checkbox';
    cb.checked = done;
    cb.id      = 'fa-step-' + step.key;
    cb.addEventListener('change', function() {
      row.classList.toggle('done', cb.checked);
      var icon = row.querySelector('.step-icon');
      if (icon) icon.textContent = cb.checked ? '✔' : '○';
    });

    var lbl = document.createElement('span');
    lbl.className   = 'step-label';
    lbl.textContent = step.label;

    var icon = document.createElement('span');
    icon.className   = 'step-icon';
    icon.textContent = done ? '✔' : '○';

    row.appendChild(cb);
    row.appendChild(lbl);
    row.appendChild(icon);
    stepsEl.appendChild(row);
  });
}

function getStepsPayload() {
  var steps = {};
  FACTURE_STEPS.forEach(function(step) {
    var cb = el('fa-step-' + step.key);
    steps[step.key] = cb ? cb.checked : false;
  });
  return steps;
}

/* ── Save ─────────────────────────────────────────────────── */
function saveFactureModal() {
  var btn = el('btn-mfa-save');
  var noSin = el('mfa-no-sinistre').value.trim();
  markRequired('mfa-no-sinistre', !noSin);
  if (!noSin) { toast('Le N° de sinistre est obligatoire.', 'error'); return; }

  var payload = {
    id:                     _mfaCurrent ? _mfaCurrent.id : '',
    no_sinistre:            noSin,
    commentaire_traitement: el('mfa-commentaire').value.trim()
  };

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      toast('Facture enregistrée.', 'success');
      renderFactures();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .saveFacture(S.token, payload);
}

/* ── Traiter (3 chemins) ─────────────────────────────────── */
function doTraiterFacture(facId) {
  var btn     = el('btn-mfa-traiter');
  var steps   = getStepsPayload();
  var comment = el('mfa-commentaire').value.trim();
  var options = Object.assign({ commentaire: comment }, steps);

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function(result) {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      var st  = result && result.statut;
      var msg = st === 'Remonté' ? 'Dossier remonté — en attente de vérification TL.'
              : st === 'Traité'  ? 'Facture traitée avec succès.'
              : 'Enregistré.';
      toast(msg, st === 'Traité' ? 'success' : 'info');
      renderFactures();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .traiterFacture(S.token, facId, options);
}

/* ── Vérifier (TL) ───────────────────────────────────────── */
function doVerifierFacture(facId) {
  var btn = el('btn-mfa-verifier');
  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      toast('Facture vérifiée — retournée en liste prioritaire.', 'success');
      renderFactures();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .verifierFacture(S.token, facId);
}

/* ═══ FACTURES REMONTÉES (vue TL) ════════════════════════════ */
function renderFacturesRemontees() {
  el('content').innerHTML = buildSkeletonTable(4);
  google.script.run
    .withSuccessHandler(paintFacturesRemontees)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listFacturesRemontees(S.token);
}

function paintFacturesRemontees(rows) {
  rows = rows || [];
  var html = '<div class="card">';
  html += '<div class="card-head"><span class="fw8">Factures remontées — En attente de vérification</span>';
  html += '<span class="chip cw">' + rows.length + ' en attente</span></div>';

  if (!rows.length) {
    html += '<div class="empty">Aucune facture remontée.</div></div>';
    el('content').innerHTML = html;
    return;
  }

  html += buildTable(
    ['Référence', 'N° sinistre', 'Créé par', 'Date remontée', 'Actions'],
    rows,
    function(r) {
      return '<tr>' +
        '<td class="fw7 t-gold">' + escHtml(r.reference || '—') + '</td>' +
        '<td class="fs-sm fw7">' + escHtml(r.no_sinistre || '—') + '</td>' +
        '<td class="fs-sm t-muted">' + escHtml(r.created_by_name || '—') + '</td>' +
        '<td class="fs-sm t-muted">' + fmtDateTime(r.remonte_at || r.updated_at) + '</td>' +
        '<td><button class="verifier-btn fs-xs" style="min-height:32px;padding:0 12px;" onclick="quickVerifierFacture(\'' + r.id + '\')">✦ Vérifier</button></td>' +
        '</tr>';
    }
  );

  html += '</div>';
  el('content').innerHTML = html;
}

function quickVerifierFacture(facId) {
  google.script.run
    .withSuccessHandler(function() {
      toast('Facture vérifiée.', 'success');
      renderFacturesRemontees();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .verifierFacture(S.token, facId);
}
</script>
