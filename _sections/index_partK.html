<script>
/* ═══════════════════════════════════════════════════════════════
   PART K — Module Facture (Remonté / Vérifié / Traité workflow)
═══════════════════════════════════════════════════════════════ */

var _factures  = [];
var _mfaCurrent = null;

/* Étapes standard facture (labels) */
var FACTURE_STEPS = [
  { key: 'step_quittance',   label: 'Quittance téléchargée' },
  { key: 'step_avis_echo',   label: 'Avis d\'écho vérifié'  },
  { key: 'step_bon_remise',  label: 'Bon de remise signé'   },
  { key: 'step_envoi_comp',  label: 'Envoi compagnie'       }
];

/* ── List ─────────────────────────────────────────────────── */
function renderFactures() {
  el('content').innerHTML = '<div class="empty skeleton" style="height:120px;"></div>';
  google.script.run
    .withSuccessHandler(paintFactures)
    .withFailureHandler(function(e) { toast(e.message || e, 'error'); })
    .listFactures(S.token, {});
}

function paintFactures(rows) {
  _factures = rows || [];
  var perms = S.permissions || {};

  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<span class="fw8">Factures</span>';
  html += '<div style="display:flex;gap:8px;align-items:center;">';
  html += '<input type="text" id="fa-search" placeholder="Recherche…" style="min-height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 12px;font:inherit;font-size:.86rem;background:var(--glass);color:var(--text);outline:none;" oninput="filterFactures()">';
  html += '<select id="fa-filter-statut" style="min-height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;font:inherit;font-size:.86rem;background:var(--glass);color:var(--text);outline:none;" onchange="filterFactures()"><option value="">Tous statuts</option>';
  ['En cours', 'Remonté', 'Vérifié', 'Traité'].forEach(function(s){ html += '<option>' + s + '</option>'; });
  html += '</select>';
  html += '<button class="b1" onclick="openFactureModal(null)">+ Nouvelle</button>';
  html += '</div></div>';
  html += '<div id="fa-table-wrap"></div>';
  html += '</div>';
  el('content').innerHTML = html;
  paintFacturesTable(_factures);
}

function filterFactures() {
  var search = el('fa-search') ? el('fa-search').value.toLowerCase() : '';
  var statut = el('fa-filter-statut') ? el('fa-filter-statut').value : '';
  var filtered = _factures.filter(function(r) {
    return (!statut || r.statut === statut) &&
           (!search || JSON.stringify(r).toLowerCase().indexOf(search) > -1);
  });
  paintFacturesTable(filtered);
}

function paintFacturesTable(rows) {
  var wrap = el('fa-table-wrap');
  if (!wrap) return;
  if (!rows.length) { wrap.innerHTML = '<div class="empty">Aucune facture.</div>'; return; }

  wrap.innerHTML = buildTable(
    ['Référence', 'N° contrat', 'Émetteur', 'Montant', 'Date', 'Statut', 'Modifié', 'Actions'],
    rows,
    function(r) {
      var statutCell = statusChip(r.statut);
      if (r.verifie_badge) {
        statutCell += ' <span class="badge-verified" title="Vérifié TL">✔</span>';
      }
      return '<tr' + (r.statut === 'Vérifié' ? ' style="background:rgba(201,168,76,.04);"' : '') + '>' +
        '<td class="fw7 t-gold">' + escHtml(r.reference || '—') + '</td>' +
        '<td class="fs-sm">' + escHtml(r.no_contrat || '—') + '</td>' +
        '<td>' + escHtml(r.emetteur || '—') + '</td>' +
        '<td class="fw7">' + (r.montant ? fmtEuro(r.montant) : '—') + '</td>' +
        '<td class="fs-sm t-muted">' + fmtDate(r.date_facture) + '</td>' +
        '<td>' + statutCell + '</td>' +
        '<td class="fs-sm t-muted">' + fmtDate(r.updated_at) + '</td>' +
        '<td><button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openFactureModal(\'' + r.id + '\')">✎</button></td>' +
        '</tr>';
    }
  );
}

/* ── Open modal ──────────────────────────────────────────── */
function openFactureModal(facId) {
  _mfaCurrent = facId ? (_factures.find(function(x){ return x.id === facId; }) || null) : null;
  var r   = _mfaCurrent || {};
  var perms = S.permissions || {};

  el('mfa-title').textContent = facId ? 'Modifier facture' : 'Nouvelle facture';
  el('mfa-ref').textContent   = r.reference || '';
  el('mfa-no-contrat').value  = r.no_contrat || '';
  el('mfa-montant').value     = r.montant || '';
  el('mfa-emetteur').value    = r.emetteur || '';
  el('mfa-date').value        = r.date_facture ? r.date_facture.substring(0, 10) : '';
  el('mfa-commentaire').value = r.commentaire_traitement || '';

  var traiterZone = el('mfa-traiter-zone');

  if (facId) {
    traiterZone.classList.remove('hidden');

    /* Badge vérifié */
    var vStrip = el('mfa-verified-strip');
    if (r.verifie_badge) {
      vStrip.classList.remove('hidden');
      el('mfa-verifie-par').textContent = r.verifie_par ? ('par ' + r.verifie_par) : '';
    } else {
      vStrip.classList.add('hidden');
    }

    /* Remonte strip */
    var rStrip = el('mfa-remonte-strip');
    if (r.statut === 'Remonté') {
      rStrip.classList.remove('hidden');
    } else {
      rStrip.classList.add('hidden');
    }

    /* Steps */
    buildFactureSteps(r);

    /* Bouton Vérifier TL */
    var btnVer = el('btn-mfa-verifier');
    if (perms.canVerifierFactures && r.statut === 'Remonté') {
      btnVer.style.display = '';
      btnVer.onclick = function() { doVerifierFacture(facId); };
    } else {
      btnVer.style.display = 'none';
    }

    el('btn-mfa-traiter').onclick = function() { doTraiterFacture(facId); };
  } else {
    traiterZone.classList.add('hidden');
  }

  el('btn-mfa-save').onclick = saveFactureModal;
  openModal('modal-facture');
}

function buildFactureSteps(r) {
  var stepsEl = el('mfa-steps');
  stepsEl.innerHTML = '';
  FACTURE_STEPS.forEach(function(step) {
    var done = !!(r[step.key]);
    var row  = document.createElement('div');
    row.className = 'step-row' + (done ? ' done' : '');

    var cb = document.createElement('input');
    cb.type    = 'checkbox';
    cb.checked = done;
    cb.id      = 'fa-step-' + step.key;
    cb.addEventListener('change', function() {
      row.classList.toggle('done', cb.checked);
    });

    var lbl = document.createElement('span');
    lbl.className   = 'step-label';
    lbl.textContent = step.label;

    var icon = document.createElement('span');
    icon.className   = 'step-icon';
    icon.textContent = done ? '✔' : '○';

    row.appendChild(cb);
    row.appendChild(lbl);
    row.appendChild(icon);
    stepsEl.appendChild(row);
  });
}

function getStepsPayload() {
  var steps = {};
  FACTURE_STEPS.forEach(function(step) {
    var cb = el('fa-step-' + step.key);
    steps[step.key] = cb ? cb.checked : false;
  });
  return steps;
}

/* ── Save (create / update) ──────────────────────────────── */
function saveFactureModal() {
  var btn = el('btn-mfa-save');
  var payload = {
    id:                    _mfaCurrent ? _mfaCurrent.id : '',
    no_contrat:            el('mfa-no-contrat').value.trim(),
    montant:               Number(el('mfa-montant').value) || 0,
    emetteur:              el('mfa-emetteur').value.trim(),
    date_facture:          el('mfa-date').value,
    commentaire_traitement: el('mfa-commentaire').value.trim()
  };
  if (!payload.no_contrat) { toast('Le N° de contrat est obligatoire.', 'error'); return; }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      toast('Facture enregistrée.', 'success');
      renderFactures();
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      toast(e.message || e, 'error');
    })
    .saveFacture(S.token, payload);
}

/* ── Traiter (3-path) ────────────────────────────────────── */
function doTraiterFacture(facId) {
  var btn = el('btn-mfa-traiter');
  var steps    = getStepsPayload();
  var comment  = el('mfa-commentaire').value.trim();
  var options  = Object.assign({ commentaire: comment }, steps);

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function(result) {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      var msg = result && result.statut === 'Remonté'
        ? 'Facture remontée pour vérification TL.'
        : (result && result.statut === 'Traité' ? 'Facture traitée.' : 'Enregistré.');
      toast(msg, result && result.statut === 'Traité' ? 'success' : 'info');
      renderFactures();
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      toast(e.message || e, 'error');
    })
    .traiterFacture(S.token, facId, options);
}

/* ── Vérifier (TL) ───────────────────────────────────────── */
function doVerifierFacture(facId) {
  var btn = el('btn-mfa-verifier');
  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-facture');
      toast('Facture vérifiée et retournée en liste prioritaire.', 'success');
      renderFactures();
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      toast(e.message || e, 'error');
    })
    .verifierFacture(S.token, facId);
}

/* ═══ FACTURES REMONTÉES (vue TL) ════════════════════════════ */
function renderFacturesRemontees() {
  el('content').innerHTML = '<div class="empty skeleton" style="height:120px;"></div>';
  google.script.run
    .withSuccessHandler(paintFacturesRemontees)
    .withFailureHandler(function(e) { toast(e.message || e, 'error'); })
    .listFacturesRemontees(S.token);
}

function paintFacturesRemontees(rows) {
  rows = rows || [];
  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<span class="fw8">Factures remontées — En attente de vérification</span>';
  html += '<span class="chip cw">' + rows.length + ' en attente</span>';
  html += '</div>';

  if (!rows.length) {
    html += '<div class="empty">Aucune facture remontée.</div></div>';
    el('content').innerHTML = html;
    return;
  }

  html += buildTable(
    ['Référence', 'N° contrat', 'Émetteur', 'Montant', 'Remonté par', 'Date remontée', 'Actions'],
    rows,
    function(r) {
      return '<tr>' +
        '<td class="fw7 t-gold">' + escHtml(r.reference || '—') + '</td>' +
        '<td class="fs-sm">' + escHtml(r.no_contrat || '—') + '</td>' +
        '<td>' + escHtml(r.emetteur || '—') + '</td>' +
        '<td class="fw7">' + (r.montant ? fmtEuro(r.montant) : '—') + '</td>' +
        '<td class="fs-sm t-muted">' + escHtml(r.created_by_name || '—') + '</td>' +
        '<td class="fs-sm t-muted">' + fmtDateTime(r.remonte_at || r.updated_at) + '</td>' +
        '<td>' +
          '<button class="verifier-btn fs-xs" style="min-height:32px;padding:0 12px;" onclick="quickVerifierFacture(\'' + r.id + '\')">✦ Vérifier</button>' +
        '</td>' +
        '</tr>';
    }
  );

  html += '</div>';
  el('content').innerHTML = html;
}

function quickVerifierFacture(facId) {
  google.script.run
    .withSuccessHandler(function() {
      toast('Facture vérifiée.', 'success');
      renderFacturesRemontees();
    })
    .withFailureHandler(function(e) { toast(e.message || e, 'error'); })
    .verifierFacture(S.token, facId);
}
</script>
