<script>
/* ═══════════════════════════════════════════════════════════════
   PART O — Paramètres (listes paramétrables)
═══════════════════════════════════════════════════════════════ */

var _paramData = {};

var PARAM_DEFS = [
  { key: 'STATUTS_PRO',           label: 'Statuts professionnels',          hint: 'Ex: CDI, CDD, Retraité…'         },
  { key: 'COMPAGNIES',            label: 'Compagnies',                      hint: 'Ex: AXA, ALLIANZ…'               },
  { key: 'STATUTS_FIN_TRAITEMENT',label: 'Statuts fin de traitement',       hint: 'Ex: Accepté, Refus, PS…'         },
  { key: 'AGREMENT_STATUS',       label: 'Statuts agrément',                hint: 'Ex: En attente de traitement…'   },
  { key: 'PRIORITIES',            label: 'Priorités',                       hint: 'Ex: Haute, Normale, Basse'       }
];

/* ── View entry ───────────────────────────────────────────── */
function renderParametres() {
  el('content').innerHTML = '<div class="empty skeleton" style="height:120px;"></div>';
  google.script.run
    .withSuccessHandler(function(data) {
      _paramData = data || {};
      paintParametresInline();
    })
    .withFailureHandler(function(e) { toast(e.message || e, 'error'); })
    .getParametres(S.token);
}

function paintParametresInline() {
  var html = '<div class="card">';
  html += '<div class="card-head"><span class="fw8">Paramètres — Listes déroulantes</span></div>';
  html += '<p class="sub" style="margin-bottom:20px;">Gérez ici les valeurs disponibles dans chaque liste. Cliquez sur ✕ pour supprimer, ou ajoutez via le champ en bas.</p>';
  html += '<div id="param-inline-body" class="grid" style="gap:24px;"></div>';
  html += '<div style="margin-top:24px;text-align:right;">';
  html += '<button class="b1 save-btn" id="btn-param-inline-save" onclick="saveParametresInline()">';
  html += '<span class="label">Enregistrer tout</span>';
  html += '<span class="spinner hidden"><i></i></span>';
  html += '</button></div>';
  html += '</div>';
  el('content').innerHTML = html;

  var body = el('param-inline-body');
  PARAM_DEFS.forEach(function(def) {
    var values = _paramData[def.key] || [];
    body.appendChild(buildParamSection(def, values));
  });
}

function buildParamSection(def, values) {
  var section = document.createElement('div');
  section.className = 'card';
  section.style.cssText = 'padding:16px;';
  section.id = 'param-section-' + def.key;

  var header = '<div class="card-head" style="margin-bottom:14px;">';
  header += '<div>';
  header += '<div class="fw7">' + escHtml(def.label) + '</div>';
  header += '<div class="fs-xs t-muted" style="margin-top:2px;">' + escHtml(def.hint || '') + '</div>';
  header += '</div>';
  header += '<span class="chip" id="param-count-' + def.key + '">' + values.length + ' valeurs</span>';
  header += '</div>';

  section.innerHTML = header;

  /* Tags wrap */
  var tagsWrap = document.createElement('div');
  tagsWrap.className = 'param-tags-wrap';
  tagsWrap.id = 'param-tags-' + def.key;
  renderParamTags(tagsWrap, def.key, values);
  section.appendChild(tagsWrap);

  /* Add input */
  var addRow = document.createElement('div');
  addRow.className = 'param-add-input';
  addRow.innerHTML =
    '<input type="text" id="param-input-' + def.key + '" placeholder="Nouvelle valeur…" ' +
    'onkeydown="if(event.key===\'Enter\')addParamValue(\'' + def.key + '\')">' +
    '<button class="b2" style="min-height:38px;padding:0 14px;flex-shrink:0;" onclick="addParamValue(\'' + def.key + '\')">+ Ajouter</button>';
  section.appendChild(addRow);

  return section;
}

function renderParamTags(wrap, key, values) {
  wrap.innerHTML = '';
  if (!values.length) {
    wrap.innerHTML = '<span class="fs-xs t-muted">Aucune valeur.</span>';
    return;
  }
  values.forEach(function(v, i) {
    var tag = document.createElement('span');
    tag.className = 'param-tag';
    tag.innerHTML =
      escHtml(v) +
      '<button class="remove-tag" title="Supprimer" onclick="removeParamValue(\'' + key + '\',' + i + ')">✕</button>';
    wrap.appendChild(tag);
  });
}

function getCurrentParamValues(key) {
  /* Read from DOM tags */
  var wrap = el('param-tags-' + key);
  if (!wrap) return (_paramData[key] || []).slice();
  var tags = wrap.querySelectorAll('.param-tag');
  var vals = [];
  tags.forEach(function(tag) {
    /* Text content minus the remove button */
    var text = tag.childNodes[0] ? tag.childNodes[0].textContent.trim() : '';
    if (text) vals.push(text);
  });
  return vals;
}

function updateParamCount(key, count) {
  var c = el('param-count-' + key);
  if (c) c.textContent = count + ' valeurs';
}

function addParamValue(key) {
  var inp = el('param-input-' + key);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) { toast('Valeur vide.', 'error'); return; }

  var current = getCurrentParamValues(key);
  if (current.indexOf(val) > -1) { toast('Cette valeur existe déjà.', 'error'); return; }

  current.push(val);
  _paramData[key] = current;
  inp.value = '';

  var wrap = el('param-tags-' + key);
  if (wrap) renderParamTags(wrap, key, current);
  updateParamCount(key, current.length);
}

function removeParamValue(key, index) {
  var current = getCurrentParamValues(key);
  current.splice(index, 1);
  _paramData[key] = current;

  var wrap = el('param-tags-' + key);
  if (wrap) renderParamTags(wrap, key, current);
  updateParamCount(key, current.length);
}

function saveParametresInline() {
  var btn = el('btn-param-inline-save');
  /* Collect all keys */
  var payload = {};
  PARAM_DEFS.forEach(function(def) {
    payload[def.key] = getCurrentParamValues(def.key);
  });

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      toast('Paramètres enregistrés.', 'success');
      /* Update lookups cache */
      if (S.lookups) {
        S.lookups.statutsPro         = payload.STATUTS_PRO;
        S.lookups.compagnies         = payload.COMPAGNIES;
        S.lookups.statutsFinTraitement = payload.STATUTS_FIN_TRAITEMENT;
        S.lookups.agrementStatuts    = payload.AGREMENT_STATUS;
        S.lookups.priorities         = payload.PRIORITIES;
      }
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      toast(e.message || e, 'error');
    })
    .saveParametres(S.token, payload);
}
</script>
</body>
</html>
