<script>
/* ═══════════════════════════════════════════════════════════════
   PART E — State, Boot, Login, Heartbeat, Hydrate
═══════════════════════════════════════════════════════════════ */

'use strict';

/* ── State global ────────────────────────────────────────────── */
const S = {
  token:       null,
  session:     null,   // { user, role, team_id }
  permissions: null,
  lookups:     null,
  dashboard:   null,
  activeView:  null,
  heartbeat:   null,
  darkMode:    localStorage.getItem('theme') === 'dark'
};

/* ── Helpers ─────────────────────────────────────────────────── */
function show(id)  { document.getElementById(id).classList.remove('hidden'); }
function hide(id)  { document.getElementById(id).classList.add('hidden'); }
function el(id)    { return document.getElementById(id); }

function toast(msg, type) {
  type = type || 'info';
  const box = document.createElement('div');
  box.className = 'toast ' + type;
  box.textContent = msg;
  el('toasts').appendChild(box);
  setTimeout(function() { box.remove(); }, 4200);
}

function setBtnLoading(btn, on) {
  if (!btn) return;
  const sp = btn.querySelector('.spinner');
  const lb = btn.querySelector('.label');
  btn.disabled = on;
  if (sp) sp.classList.toggle('hidden', !on);
  if (lb) lb.style.opacity = on ? '0' : '';
}

function fmtEuro(n) {
  return (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtDuration(s) {
  if (!s) return '—';
  s = Number(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h ? h + 'h ' + m + 'min' : m + 'min';
}

function initials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  return parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : String(name).substring(0, 2).toUpperCase();
}

function escHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function parseHistorique(row) {
  try { return JSON.parse(row.historique_json || '[]'); }
  catch(e) { return []; }
}

function parseProfils(row) {
  try { return JSON.parse(row.profils_json || '[]'); }
  catch(e) { return []; }
}

/* ── Theme ───────────────────────────────────────────────────── */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', S.darkMode ? 'dark' : 'light');
  const btn = el('btn-theme');
  if (btn) btn.textContent = S.darkMode ? '☾' : '☀';
}

function toggleTheme() {
  S.darkMode = !S.darkMode;
  localStorage.setItem('theme', S.darkMode ? 'dark' : 'light');
  applyTheme();
}

/* ── Boot ────────────────────────────────────────────────────── */
function boot() {
  applyTheme();
  const token = sessionStorage.getItem('token');
  if (token) {
    S.token = token;
    el('boot-msg').textContent = 'Reprise de session…';
    google.script.run
      .withSuccessHandler(onBootstrapData)
      .withFailureHandler(function(e) {
        sessionStorage.removeItem('token');
        S.token = null;
        showLogin();
      })
      .getBootstrapData(token);
  } else {
    showLogin();
  }
}

function showLogin() {
  hide('boot');
  show('login');
  const inp = el('login-user');
  if (inp) setTimeout(function() { inp.focus(); }, 80);
}

function onBootstrapData(data) {
  hide('boot');
  if (!data || data.error) { showLogin(); return; }
  S.session     = data.session;
  S.permissions = data.session && data.session.permissions ? data.session.permissions : {};
  S.lookups     = data.lookups;
  S.dashboard   = data.dashboard;
  startApp();
}

/* ── Login ───────────────────────────────────────────────────── */
function initLogin() {
  el('btn-login').addEventListener('click', doLogin);
  el('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
}

function doLogin() {
  const login    = el('login-user').value.trim();
  const password = el('login-pass').value;
  const errBox   = el('login-err');
  const errMsg   = el('login-err-msg');
  const btn      = el('btn-login');

  errBox.classList.add('hidden');
  if (!login || !password) {
    errMsg.textContent = 'Veuillez remplir tous les champs.';
    errBox.classList.remove('hidden');
    return;
  }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function(data) {
      setBtnLoading(btn, false);
      if (data && data.token) {
        S.token = data.token;
        sessionStorage.setItem('token', data.token);
        S.session     = data.session;
        S.permissions = data.session && data.session.permissions ? data.session.permissions : {};
        S.lookups     = data.lookups;
        S.dashboard   = data.dashboard;
        startApp();
      } else {
        errMsg.textContent = (data && data.error) ? data.error : 'Identifiants incorrects.';
        errBox.classList.remove('hidden');
      }
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      errMsg.textContent = e.message || 'Erreur de connexion.';
      errBox.classList.remove('hidden');
    })
    .loginUser(login, password);
}

/* ── Start App ───────────────────────────────────────────────── */
function startApp() {
  hide('login');
  show('app');
  hydrateShell();
  buildNav();
  startHeartbeat();
  navigate('dashboard');
  el('btn-theme').addEventListener('click', toggleTheme);
  el('btn-logout').addEventListener('click', doLogout);
}

/* ── Hydrate shell ───────────────────────────────────────────── */
function hydrateShell() {
  const u = S.session && S.session.user ? S.session.user : {};
  const name = u.full_name || '—';
  const role = u.role || '—';

  el('sb-name').textContent  = name;
  el('sb-role').textContent  = role;
  el('sb-scope').textContent = S.dashboard ? S.dashboard.scopeLabel : '';
  el('sb-avatar').textContent = initials(name);
  el('sb-ver').textContent   = 'v2.0';
}

/* ── Heartbeat ───────────────────────────────────────────────── */
function startHeartbeat() {
  if (S.heartbeat) clearInterval(S.heartbeat);
  S.heartbeat = setInterval(function() {
    google.script.run
      .withSuccessHandler(function() {})
      .withFailureHandler(function() {})
      .heartbeat(S.token);
  }, 270000); // 4.5 min
}

/* ── Logout ──────────────────────────────────────────────────── */
function doLogout() {
  if (S.heartbeat) clearInterval(S.heartbeat);
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .logoutUser(S.token);
  S.token = null;
  sessionStorage.removeItem('token');
  hide('app');
  hide('login');
  show('boot');
  el('boot-msg').textContent = 'Déconnexion…';
  setTimeout(function() {
    hide('boot');
    show('login');
    el('login-user').value = '';
    el('login-pass').value = '';
  }, 600);
}

/* ── DOMContentLoaded ────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  initLogin();
  boot();
});
</script>
