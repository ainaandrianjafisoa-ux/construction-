<script>
/* ═══════════════════════════════════════════════════════════════
   PART E — State, Boot, Login, Heartbeat, Hydrate
═══════════════════════════════════════════════════════════════ */

'use strict';

/* ── State global ────────────────────────────────────────────── */
const S = {
  token:       null,
  session:     null,
  permissions: null,
  lookups:     null,
  dashboard:   null,
  activeView:  null,
  heartbeat:   null,
  darkMode:    localStorage.getItem('theme') === 'dark'
};

/* ── Helpers DOM ─────────────────────────────────────────────── */
function show(id)  { const e = document.getElementById(id); if (e) e.classList.remove('hidden'); }
function hide(id)  { const e = document.getElementById(id); if (e) e.classList.add('hidden'); }
function el(id)    { return document.getElementById(id); }

/* ── Toast (avec barre de progression + bouton ✕) ───────────── */
var _toastLimit = 4;
function toast(msg, type, durationMs) {
  type       = type       || 'info';
  durationMs = durationMs || 4500;

  const wrap = el('toasts');
  if (!wrap) return;

  // Limiter le nombre de toasts visibles
  const existing = wrap.querySelectorAll('.toast');
  if (existing.length >= _toastLimit) existing[0].remove();

  const box = document.createElement('div');
  box.className = 'toast ' + type;

  const msgEl = document.createElement('span');
  msgEl.className   = 'toast-msg';
  msgEl.textContent = msg;

  const closeEl = document.createElement('button');
  closeEl.className   = 'toast-close';
  closeEl.textContent = '✕';
  closeEl.onclick     = function() { _removeToast(box); };

  const barEl = document.createElement('div');
  barEl.className = 'toast-bar';
  const fillEl = document.createElement('div');
  fillEl.className = 'toast-bar-fill';
  barEl.appendChild(fillEl);

  box.appendChild(msgEl);
  box.appendChild(closeEl);
  box.appendChild(barEl);
  wrap.appendChild(box);

  // Animer la barre
  requestAnimationFrame(function() {
    fillEl.style.transition = 'width ' + durationMs + 'ms linear';
    fillEl.style.width = '0%';
  });

  const tid = setTimeout(function() { _removeToast(box); }, durationMs);
  box._tid = tid;
}

function _removeToast(box) {
  if (!box.parentNode) return;
  clearTimeout(box._tid);
  box.style.animation = 'slideOutRight .2s var(--ease) forwards';
  setTimeout(function() { if (box.parentNode) box.remove(); }, 210);
}

/* ── Ripple sur bouton ───────────────────────────────────────── */
document.addEventListener('click', function(e) {
  const btn = e.target.closest('button:not(:disabled)');
  if (!btn || btn.classList.contains('toast-close') || btn.classList.contains('remove-tag')) return;
  const rect   = btn.getBoundingClientRect();
  const size   = Math.max(rect.width, rect.height) * 1.8;
  const x      = e.clientX - rect.left - size / 2;
  const y      = e.clientY - rect.top  - size / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + x + 'px;top:' + y + 'px;';
  btn.appendChild(ripple);
  setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 600);
}, true);

/* ── Helpers formatage ───────────────────────────────────────── */
function fmtEuro(n) {
  return (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtDuration(s) {
  if (!s) return '—';
  s = Number(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h ? h + 'h ' + m + 'min' : m + 'min';
}
function initials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  return parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : String(name).substring(0, 2).toUpperCase();
}
function escHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function parseHistorique(row) {
  try { return JSON.parse(row.historique_json || '[]'); } catch(e) { return []; }
}
function parseProfils(row) {
  try { return JSON.parse(row.profils_json || '[]'); } catch(e) { return []; }
}

/* ── KPI count-up ────────────────────────────────────────────── */
function animateCountUp(el, target, duration) {
  if (!el) return;
  duration = duration || 700;
  const start = performance.now();
  const from  = 0;
  function step(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3); // ease-out cubic
    el.textContent = Math.round(from + (target - from) * ease);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

/* ── Theme ───────────────────────────────────────────────────── */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', S.darkMode ? 'dark' : 'light');
  const btn = el('btn-theme');
  if (btn) btn.textContent = S.darkMode ? '☾' : '☀';
}
function toggleTheme() {
  S.darkMode = !S.darkMode;
  localStorage.setItem('theme', S.darkMode ? 'dark' : 'light');
  applyTheme();
}

/* ── Gestion session expirée ─────────────────────────────────── */
function handleSessionExpired() {
  if (S.heartbeat) clearInterval(S.heartbeat);
  S.token = null;
  sessionStorage.removeItem('token');
  // Fermer toute modale ouverte
  document.querySelectorAll('.overlay:not(.hidden)').forEach(function(o) {
    o.classList.add('hidden');
  });
  document.body.style.overflow = '';
  hide('app');
  show('login');
  el('login-user').value = '';
  el('login-pass').value = '';
  // Afficher message
  const errMsg = el('login-err-msg');
  const errBox = el('login-err');
  if (errMsg) errMsg.textContent = 'Votre session a expiré. Veuillez vous reconnecter.';
  if (errBox) errBox.classList.remove('hidden');
}

/* Intercepteur global des erreurs GAS "session expirée" */
function gasFailureHandler(e, btn) {
  if (btn) setBtnLoading(btn, false);
  const msg = (e && e.message) ? e.message : String(e);
  if (msg.toLowerCase().indexOf('expir') > -1 || msg.toLowerCase().indexOf('session') > -1) {
    handleSessionExpired();
  } else {
    toast(msg, 'error');
  }
}

/* ── Boot ────────────────────────────────────────────────────── */
function boot() {
  applyTheme();
  const token = sessionStorage.getItem('token');
  if (token) {
    S.token = token;
    el('boot-msg').textContent = 'Reprise de session…';
    google.script.run
      .withSuccessHandler(onBootstrapData)
      .withFailureHandler(function(e) {
        sessionStorage.removeItem('token');
        S.token = null;
        showLogin();
      })
      .getBootstrapData(token);
  } else {
    showLogin();
  }
}

function showLogin() {
  hide('boot');
  show('login');
  const inp = el('login-user');
  if (inp) setTimeout(function() { inp.focus(); }, 80);
}

/* Bootstrap : session reprise (F5). Dashboard chargé en async. */
function onBootstrapData(data) {
  hide('boot');
  if (!data || data.error) { showLogin(); return; }
  S.session     = data.session;
  S.permissions = data.session && data.session.permissions ? data.session.permissions : {};
  S.lookups     = data.lookups;
  S.dashboard   = null; // sera chargé en async par renderDashboard
  startApp();
}

/* ── Login ───────────────────────────────────────────────────── */
function initLogin() {
  el('btn-login').addEventListener('click', doLogin);
  el('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
}

function doLogin() {
  const login    = el('login-user').value.trim();
  const password = el('login-pass').value;
  const errBox   = el('login-err');
  const errMsg   = el('login-err-msg');
  const btn      = el('btn-login');

  errBox.classList.add('hidden');
  if (!login || !password) {
    errMsg.textContent = 'Veuillez remplir tous les champs.';
    errBox.classList.remove('hidden');
    return;
  }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function(data) {
      setBtnLoading(btn, false);
      if (data && data.token) {
        S.token       = data.token;
        sessionStorage.setItem('token', data.token);
        S.session     = data.session;
        S.permissions = data.session && data.session.permissions ? data.session.permissions : {};
        S.lookups     = data.lookups;
        S.dashboard   = null; // chargé en async dans renderDashboard
        startApp();
      } else {
        errMsg.textContent = (data && data.error) ? data.error : 'Identifiants incorrects.';
        errBox.classList.remove('hidden');
      }
    })
    .withFailureHandler(function(e) {
      setBtnLoading(btn, false);
      errMsg.textContent = (e && e.message) ? e.message : 'Erreur de connexion.';
      errBox.classList.remove('hidden');
    })
    .loginUser(login, password);
}

/* ── Start App ───────────────────────────────────────────────── */
function startApp() {
  hide('login');
  show('app');
  hydrateShell();
  buildNav();
  startHeartbeat();
  navigate('dashboard');
  el('btn-theme').addEventListener('click', toggleTheme);
  el('btn-logout').addEventListener('click', doLogout);
}

/* ── Hydrate shell ───────────────────────────────────────────── */
function hydrateShell() {
  const u    = S.session && S.session.user ? S.session.user : {};
  const name = u.full_name || '—';
  el('sb-name').textContent   = name;
  el('sb-role').textContent   = u.role || '—';
  el('sb-scope').textContent  = '';
  el('sb-avatar').textContent = initials(name);
  el('sb-ver').textContent    = 'v2.0';
}

/* ── Helpers ─────────────────────────────────────────────────── */
function setBtnLoading(btn, on) {
  if (!btn) return;
  const sp = btn.querySelector('.spinner');
  const lb = btn.querySelector('.label');
  btn.disabled = on;
  if (sp) sp.classList.toggle('hidden', !on);
  if (lb) lb.style.opacity = on ? '0' : '';
}

/* ── Heartbeat — intervalle basé sur la config serveur ──────── */
function startHeartbeat() {
  if (S.heartbeat) clearInterval(S.heartbeat);
  // heartbeatSeconds retourné par le backend (défaut 90s), x1000 → ms
  const intervalMs = ((S.session && S.session.heartbeatSeconds) || 90) * 1000;
  S.heartbeat = setInterval(function() {
    if (!S.token) return;
    google.script.run
      .withSuccessHandler(function() {})
      .withFailureHandler(function(e) {
        // Si la session a expiré pendant un heartbeat → reconnecter
        const msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('expir') > -1 || msg.indexOf('session') > -1) {
          handleSessionExpired();
        }
      })
      .heartbeat(S.token);
  }, intervalMs);
}

/* ── Logout ──────────────────────────────────────────────────── */
function doLogout() {
  if (S.heartbeat) clearInterval(S.heartbeat);
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .logoutUser(S.token);
  S.token = null;
  sessionStorage.removeItem('token');
  hide('app');
  show('login');
  el('login-user').value = '';
  el('login-pass').value = '';
}

/* ── Profil / Changement de mot de passe ────────────────────── */
function openProfileModal() {
  ['cp-current', 'cp-new', 'cp-confirm'].forEach(function(id) {
    var f = el(id);
    if (f) { f.value = ''; f.classList.remove('invalid'); }
  });
  openModal('modal-profile');
  setTimeout(function() { var f = el('cp-current'); if (f) f.focus(); }, 60);
}

function doChangePassword() {
  var btn     = el('btn-cp-save');
  var current = el('cp-current').value;
  var newPwd  = el('cp-new').value;
  var confirm = el('cp-confirm').value;

  markRequired('cp-current', !current);
  markRequired('cp-new',     !newPwd);
  markRequired('cp-confirm', !confirm);
  if (!current || !newPwd || !confirm) {
    toast('Tous les champs sont obligatoires.', 'error'); return;
  }
  if (newPwd !== confirm) {
    markRequired('cp-confirm', true);
    toast('Les mots de passe ne correspondent pas.', 'error'); return;
  }
  if (newPwd.length < 6) {
    markRequired('cp-new', true);
    toast('Minimum 6 caractères requis.', 'error'); return;
  }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-profile');
      toast('Mot de passe modifié avec succès.', 'success');
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .changePassword(S.token, { current_password: current, new_password: newPwd });
}

/* ── DOMContentLoaded ────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  initLogin();
  boot();
  el('btn-profile').addEventListener('click', openProfileModal);
});
</script>
