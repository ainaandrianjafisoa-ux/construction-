<script>
/* ═══════════════════════════════════════════════════════════════
   PART I — Module Agrément (multi-profils, calcul, override, réassignation)
═══════════════════════════════════════════════════════════════ */

var _agrements     = [];
var _magCurrent    = null;   // row being edited
var _magProfils    = [];     // array of profil objects
var _magActiveProfil = 0;
var _magReassignId = null;

/* ── List ─────────────────────────────────────────────────── */
function renderAgrements() {
  el('content').innerHTML = buildSkeletonTable(6);
  google.script.run
    .withSuccessHandler(paintAgrements)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listAgrements(S.token, {});
}

function paintAgrements(rows) {
  _agrements = rows || [];
  var perms  = S.permissions || {};

  var html = '<div class="card">';
  html += '<div class="card-head">';
  html += '<span class="fw8">Agréments</span>';
  html += '<div style="display:flex;gap:8px;align-items:center;">';
  html += '<input type="text" id="ag-search" placeholder="Recherche…" class="filter-input" oninput="filterAgrements()">';
  html += '<select id="ag-filter-statut" class="filter-select" onchange="filterAgrements()"><option value="">Tous statuts</option>';
  var statuts = ['En attente de traitement', 'En cours de traitement', 'Validé', 'Clos'];
  statuts.forEach(function(s){ html += '<option>' + s + '</option>'; });
  html += '</select>';
  html += '<button class="b1" onclick="openAgrementModal(null)">+ Nouveau</button>';
  html += '</div></div>';

  html += '<div id="ag-table-wrap"></div>';
  html += '</div>';
  el('content').innerHTML = html;
  paintAgrementsTable(_agrements);
}

function filterAgrements() {
  var search = (el('ag-search') ? el('ag-search').value.toLowerCase() : '');
  var statut = (el('ag-filter-statut') ? el('ag-filter-statut').value : '');
  var filtered = _agrements.filter(function(r) {
    var matchS = !statut || r.statut === statut;
    var matchQ = !search || JSON.stringify(r).toLowerCase().indexOf(search) > -1;
    return matchS && matchQ;
  });
  paintAgrementsTable(filtered);
}

function paintAgrementsTable(rows) {
  var wrap = el('ag-table-wrap');
  if (!wrap) return;
  var perms = S.permissions || {};

  if (!rows.length) { wrap.innerHTML = '<div class="empty">Aucun agrément.</div>'; return; }

  wrap.innerHTML = buildTable(
    ['Référence', 'N° dossier', 'Compagnie', 'Type', 'Client', 'Loyer', 'Plafond', 'Solvabilité', 'Statut', 'Ambassadeur', 'Actions'],
    rows,
    function(r) {
      var plafond = r.plafond_final ? fmtEuro(r.plafond_final) : '—';
      var solvChip = r.resultat_solvabilite
        ? (r.resultat_solvabilite === 'Solvable'
            ? '<span class="chip cs">✔ Solvable</span>'
            : '<span class="chip cd">✘ Non solvable</span>')
        : '—';
      if (r.solvabilite_override) {
        solvChip += ' <span class="chip cw" title="Dérogation">⚑</span>';
      }

      var actions = '<button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openAgrementModal(\'' + r.id + '\')">✎</button>';
      if (perms.canReassigner) {
        actions += ' <button class="b2 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openReassignModal(\'' + r.id + '\')">↻</button>';
      }

      return '<tr>' +
        '<td class="fw7 t-gold">' + escHtml(r.reference || '—') + '</td>' +
        '<td class="fs-sm">' + escHtml(r.no_dossier || '—') + '</td>' +
        '<td>' + escHtml(r.compagnie || '—') + '</td>' +
        '<td class="fs-sm">' + escHtml(r.type_dossier || '—') + '</td>' +
        '<td>' + escHtml(r.type_client || '—') + '</td>' +
        '<td class="fw7">' + (r.loyer ? fmtEuro(r.loyer) : '—') + '</td>' +
        '<td class="fw7 t-gold">' + plafond + '</td>' +
        '<td>' + solvChip + '</td>' +
        '<td>' + statusChip(r.statut) + '</td>' +
        '<td class="fs-sm t-muted">' + escHtml(r.ambassadeur_name || '—') + '</td>' +
        '<td><div style="display:flex;gap:4px;">' + actions + '</div></td>' +
        '</tr>';
    }
  );
}

/* ── Open modal ──────────────────────────────────────────── */
function openAgrementModal(agrId) {
  _magCurrent      = agrId ? (_agrements.find(function(x){ return x.id === agrId; }) || null) : null;
  _magProfils      = _magCurrent ? (parseProfils(_magCurrent) || []) : [];
  _magActiveProfil = 0;

  var r   = _magCurrent || {};
  var lk  = S.lookups || {};
  var perms = S.permissions || {};

  /* Title */
  el('mag-title').textContent = agrId ? 'Modifier agrément' : 'Nouveau dossier agrément';
  el('mag-ref').textContent   = r.reference || '';

  /* Compagnie */
  populateSelect(el('mag-compagnie'), lk.compagnies || ['AXA', 'ALLIANZ'], r.compagnie, '— Compagnie —');

  /* Type dossier */
  populateSelect(el('mag-type-dossier'), lk.typesDossier || [], r.type_dossier, '— Type —');

  /* Type client */
  el('mag-type-client').value = r.type_client || 'Locataire';

  /* Priorité */
  populateSelect(el('mag-priority'), lk.priorities || ['Normale', 'Haute', 'Basse'], r.priority, '— Priorité —');

  /* Ambassadeur */
  var ambassadeurs = (lk.users || []).filter(function(u){ return u.role === 'ambassador'; });
  populateSelect(el('mag-ambassadeur'), ambassadeurs, r.ambassadeur_assigne, '— Auto —');

  /* Gestionnaire+ */
  el('mag-gestionnaire-plus').value = r.gestionnaire_plus || '';

  /* N° dossier */
  el('mag-no-dossier').value = r.no_dossier || '';

  /* Loyer */
  el('mag-loyer').value = r.loyer || '';

  /* Nombre profils */
  var nbProfils = Math.max(1, _magProfils.length || Number(r.nombre_profils) || 1);
  el('mag-nb-profils').value = String(nbProfils);

  /* Init profils array */
  if (_magProfils.length === 0) {
    _magProfils = [buildDefaultProfil(1)];
  }
  while (_magProfils.length < nbProfils) {
    _magProfils.push(buildDefaultProfil(_magProfils.length + 1));
  }
  _magProfils = _magProfils.slice(0, nbProfils);

  /* Fin de traitement (TL/Admin only) */
  if (perms.canValidateAgrement) {
    el('mag-fin-zone').classList.remove('hidden');
    populateSelect(el('mag-statut-fin'), lk.statutsFinTraitement || [], r.statut_fin_traitement, '— Choisir —');
    populateSelect(el('mag-statut'), lk.agrementStatuts || [], r.statut, '— Choisir —');
  } else {
    el('mag-fin-zone').classList.add('hidden');
  }

  el('mag-commentaire').value = r.commentaire || '';

  /* Rebuild profil UI */
  renderProfilTabs();
  renderProfilForms();
  updateMagSolvSummary();

  /* Override zone */
  if (agrId && perms.canOverrideSolvabilite) {
    el('mag-override-zone').classList.remove('hidden');
    el('mag-override-resultat').value = r.resultat_solvabilite || 'Solvable';
    el('mag-override-comment').value  = r.solvabilite_commentaire || '';
  } else {
    el('mag-override-zone').classList.add('hidden');
  }

  /* Wire nombre profils change */
  el('mag-nb-profils').onchange = onNbProfilsChange;
  el('btn-mag-save').onclick    = saveMagAgrement;
  el('btn-mag-override').onclick = doOverrideSolvabilite;

  openModal('modal-agrement');
}

/* ── Profil helpers ──────────────────────────────────────── */
function buildDefaultProfil(n) {
  return {
    num:               n,
    statut_pro:        '',
    duree_cdd_mois:    '',
    nb_bulletins:      3,
    salaires:          ['', '', ''],
    revenu_complementaire: false,
    montant_complementaire: 0
  };
}

function onNbProfilsChange() {
  var n = Number(el('mag-nb-profils').value) || 1;
  while (_magProfils.length < n) {
    _magProfils.push(buildDefaultProfil(_magProfils.length + 1));
  }
  _magProfils = _magProfils.slice(0, n);
  if (_magActiveProfil >= _magProfils.length) _magActiveProfil = _magProfils.length - 1;
  renderProfilTabs();
  renderProfilForms();
  updateMagSolvSummary();
}

function renderProfilTabs() {
  var tabs = el('mag-profil-tabs');
  tabs.innerHTML = '';
  _magProfils.forEach(function(p, i) {
    var btn = document.createElement('button');
    btn.className = 'profil-tab' + (i === _magActiveProfil ? ' active' : '');
    btn.textContent = 'Profil ' + (i + 1);
    btn.onclick = function() {
      saveMagProfilFields(_magActiveProfil);
      _magActiveProfil = i;
      renderProfilTabs();
      renderProfilForms();
    };
    tabs.appendChild(btn);
  });
}

function renderProfilForms() {
  var container = el('mag-profil-forms');
  container.innerHTML = '';
  _magProfils.forEach(function(p, i) {
    var vis = i === _magActiveProfil ? '' : 'display:none;';
    var lk = S.lookups || {};
    var statutOptions = (lk.statutsPro || ['CDI', 'Fonctionnaire titulaire', 'CDD', 'Retraité', 'Étudiant', 'TNS'])
      .map(function(s) {
        return '<option value="' + s + '"' + (p.statut_pro === s ? ' selected' : '') + '>' + s + '</option>';
      }).join('');

    var cddClass = (p.statut_pro === 'CDD') ? '' : 'hidden';

    var salInputs = '';
    for (var k = 0; k < 3; k++) {
      salInputs +=
        '<div class="field">' +
        '<label>Bulletin ' + (k + 1) + ' (€)</label>' +
        '<input type="number" id="mag-sal-' + i + '-' + k + '" value="' + (p.salaires[k] || '') + '" placeholder="0" min="0" step="0.01" oninput="onProfilInput(' + i + ')">' +
        '</div>';
    }

    var div = document.createElement('div');
    div.id   = 'mag-profil-' + i;
    div.style.cssText = vis;
    div.innerHTML =
      '<div class="profil-card active">' +
      '<div class="profil-card-header">' +
      '<h4>Profil ' + (i + 1) + '</h4>' +
      '</div>' +
      '<div class="g2">' +
      '<div class="field">' +
      '<label>Statut professionnel</label>' +
      '<select id="mag-statut-pro-' + i + '" onchange="onStatutProChange(' + i + ')">' +
      '<option value="">— Choisir —</option>' + statutOptions +
      '</select>' +
      '</div>' +
      '<div class="field ' + cddClass + '" id="mag-cdd-field-' + i + '">' +
      '<label>Durée CDD (mois)</label>' +
      '<input type="number" id="mag-cdd-mois-' + i + '" value="' + (p.duree_cdd_mois || '') + '" placeholder="ex: 6" min="1" oninput="onProfilInput(' + i + ')">' +
      '</div>' +
      '</div>' +
      '<div class="g3" style="margin-top:12px;">' + salInputs + '</div>' +
      '<div class="row" style="margin-top:12px;gap:10px;">' +
      '<label style="display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--text-soft);cursor:pointer;">' +
      '<input type="checkbox" id="mag-rev-comp-' + i + '"' + (p.revenu_complementaire ? ' checked' : '') + ' onchange="onRevCompChange(' + i + ')">' +
      'Revenu complémentaire' +
      '</label>' +
      '</div>' +
      '<div id="mag-rev-comp-field-' + i + '" class="field' + (p.revenu_complementaire ? '' : ' hidden') + '" style="margin-top:10px;">' +
      '<label>Montant complémentaire (€)</label>' +
      '<input type="number" id="mag-rev-comp-montant-' + i + '" value="' + (p.montant_complementaire || '') + '" placeholder="0" min="0" step="0.01" oninput="onProfilInput(' + i + ')">' +
      '</div>' +
      '<div id="mag-profil-result-' + i + '" class="profil-result" style="display:none;"></div>' +
      '</div>'; // profil-card

    container.appendChild(div);
  });
}

function onStatutProChange(i) {
  var sp = el('mag-statut-pro-' + i);
  if (!sp) return;
  var v       = sp.value;
  var cddF    = el('mag-cdd-field-' + i);
  if (cddF) cddF.classList.toggle('hidden', v !== 'CDD');

  /* Force Garant if Étudiant */
  if (v === 'Étudiant') el('mag-type-client').value = 'Garant';

  saveMagProfilFields(i);
  onProfilInput(i);
}

function onRevCompChange(i) {
  var cb  = el('mag-rev-comp-' + i);
  var fld = el('mag-rev-comp-field-' + i);
  if (fld) fld.classList.toggle('hidden', !cb.checked);
  saveMagProfilFields(i);
  onProfilInput(i);
}

function onProfilInput(i) {
  saveMagProfilFields(i);
  updateMagSolvSummary();
}

function saveMagProfilFields(i) {
  if (i < 0 || i >= _magProfils.length) return;
  var p = _magProfils[i];
  var spEl = el('mag-statut-pro-' + i);
  if (spEl) p.statut_pro = spEl.value;
  var cddEl = el('mag-cdd-mois-' + i);
  if (cddEl) p.duree_cdd_mois = Number(cddEl.value) || '';
  p.salaires = [];
  for (var k = 0; k < 3; k++) {
    var sEl = el('mag-sal-' + i + '-' + k);
    p.salaires.push(sEl ? (Number(sEl.value) || 0) : 0);
  }
  var cbEl  = el('mag-rev-comp-' + i);
  var mcEl  = el('mag-rev-comp-montant-' + i);
  p.revenu_complementaire = cbEl ? cbEl.checked : false;
  p.montant_complementaire = mcEl ? (Number(mcEl.value) || 0) : 0;
}

/* ── Live calc ───────────────────────────────────────────── */
function updateMagSolvSummary() {
  /* Build profils snapshot */
  for (var j = 0; j < _magProfils.length; j++) { saveMagProfilFields(j); }
  var compagnie  = el('mag-compagnie') ? el('mag-compagnie').value : '';
  var typeClient = el('mag-type-client') ? el('mag-type-client').value : 'Locataire';
  var loyer      = Number(el('mag-loyer') ? el('mag-loyer').value : 0) || 0;

  var payload = {
    profils:     _magProfils,
    compagnie:   compagnie,
    type_client: typeClient,
    loyer:       loyer
  };

  google.script.run
    .withSuccessHandler(function(result) {
      paintMagSolvSummary(result, loyer);
    })
    .withFailureHandler(function() {})
    .calculateMultiProfileSolvabiliteServer(payload);
}

function paintMagSolvSummary(result, loyer) {
  if (!result) return;
  var zone = el('mag-solv-summary');
  if (zone) zone.classList.remove('hidden');

  /* Per-profil result in form */
  (result.profils || []).forEach(function(pr, i) {
    var resEl = el('mag-profil-result-' + i);
    if (!resEl) return;
    resEl.style.display = '';
    resEl.innerHTML =
      '<div style="display:flex;justify-content:space-between;font-size:.83rem;">' +
      '<span class="t-muted">Plafond calculé</span>' +
      '<span class="fw7 t-gold">' + fmtEuro(pr.plafond || 0) + '</span>' +
      '</div>';
  });

  /* Summary strip */
  var strip = el('mag-profils-summary-strip');
  if (strip) {
    strip.innerHTML = (result.profils || []).map(function(pr, i) {
      return '<div class="profil-sum-cell">' +
        '<div class="psn">Profil ' + (i + 1) + '</div>' +
        '<div class="psv">' + fmtEuro(pr.plafond || 0) + '</div>' +
        '</div>';
    }).join('') +
    '<div class="profil-sum-cell gold">' +
    '<div class="psn">Total</div>' +
    '<div class="psv">' + fmtEuro(result.plafond_total || 0) + '</div>' +
    '</div>';
  }

  /* Total */
  var totalEl = el('mag-total-val');
  if (totalEl) totalEl.textContent = fmtEuro(result.plafond_total || 0);

  /* Solv band */
  var band = el('mag-solv-band');
  if (band && loyer > 0) {
    band.classList.remove('hidden');
    var ok = (result.plafond_total || 0) >= loyer;
    band.className = 'solv-band ' + (ok ? 'ok' : 'nok');
    band.innerHTML = (ok ? '✔ Solvable' : '✘ Non solvable') +
      ' — Loyer : ' + fmtEuro(loyer) + ' / Plafond : ' + fmtEuro(result.plafond_total || 0);
  }
}

/* ── Save ────────────────────────────────────────────────── */
function saveMagAgrement() {
  var btn = el('btn-mag-save');
  for (var j = 0; j < _magProfils.length; j++) { saveMagProfilFields(j); }

  var perms = S.permissions || {};
  var payload = {
    id:               _magCurrent ? _magCurrent.id : '',
    no_dossier:       el('mag-no-dossier').value.trim(),
    compagnie:        el('mag-compagnie').value,
    type_dossier:     el('mag-type-dossier').value,
    type_client:      el('mag-type-client').value,
    priority:         el('mag-priority').value,
    ambassadeur_assigne: el('mag-ambassadeur').value,
    gestionnaire_plus:el('mag-gestionnaire-plus').value.trim(),
    loyer:            Number(el('mag-loyer').value) || 0,
    nombre_profils:   _magProfils.length,
    profils_json:     JSON.stringify(_magProfils),
    commentaire:      el('mag-commentaire').value.trim()
  };
  if (perms.canValidateAgrement) {
    payload.statut_fin_traitement = el('mag-statut-fin').value;
    payload.statut = el('mag-statut').value;
  }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-agrement');
      toast('Agrément enregistré.', 'success');
      renderAgrements();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .saveAgrement(S.token, payload);
}

/* ── Override solvabilité ────────────────────────────────── */
function doOverrideSolvabilite() {
  if (!_magCurrent) return;
  var btn       = el('btn-mag-override');
  var resultat  = el('mag-override-resultat').value;
  var comment   = el('mag-override-comment').value.trim();
  if (!comment) { toast('Le motif de dérogation est obligatoire.', 'error'); return; }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      toast('Dérogation enregistrée.', 'success');
      closeModal('modal-agrement');
      renderAgrements();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .overrideSolvabilite(S.token, _magCurrent.id, resultat, comment);
}

/* ── Réassignation ───────────────────────────────────────── */
function openReassignModal(agrId) {
  _magReassignId = agrId;
  var lk = S.lookups || {};
  var ambassadeurs = (lk.users || []).filter(function(u){ return u.role === 'ambassador'; });
  var sel = el('reassign-ambassadeur');
  populateSelect(sel, ambassadeurs, null, '— Sélectionner —');
  el('btn-reassign-confirm').onclick = function() { doReassign(); };
  openModal('modal-reassign');
}

function doReassign() {
  if (!_magReassignId) return;
  var btn      = el('btn-reassign-confirm');
  var newAmbId = el('reassign-ambassadeur').value;
  if (!newAmbId) { toast('Sélectionnez un ambassadeur.', 'error'); return; }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-reassign');
      toast('Dossier réassigné.', 'success');
      renderAgrements();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .reassignerAgrement(S.token, _magReassignId, newAmbId);
}
</script>
