<script>
/* ═══════════════════════════════════════════════════════════════
   PART H — Utilisateurs & Équipes
═══════════════════════════════════════════════════════════════ */

/* ═══ UTILISATEURS ══════════════════════════════════════════ */
var _users = [];

function renderUsers() {
  el('content').innerHTML = buildSkeletonTable(5);
  google.script.run
    .withSuccessHandler(paintUsers)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listUsers(S.token, {});
}

function paintUsers(rows) {
  _users = rows || [];
  var myRole = S.session && S.session.user ? S.session.user.role : '';
  var perms  = S.permissions || {};

  var html = '<div class="card">';
  html += '<div class="card-head"><span class="fw8">Utilisateurs</span>';
  if (perms.canManageUsers) {
    html += '<button class="b1" onclick="openUserModal(null)">+ Nouveau</button>';
  }
  html += '</div>';

  html += buildTable(
    ['Nom', 'Login', 'Rôle', 'Team Leader', 'Équipe', 'Statut', 'Actions'],
    _users,
    function(u) {
      var teamName = '';
      if (S.lookups && S.lookups.teams) {
        var t = S.lookups.teams.find(function(x){ return x.id === u.team_id; });
        if (t) teamName = t.name;
      }
      var tlName = u.team_leader_name || '—';
      var canEdit   = myRole === 'super_admin' || (myRole === 'team_leader' && u.role === 'ambassador');
      var canToggle = canEdit && u.id !== (S.session && S.session.user ? S.session.user.id : '');
      return '<tr>' +
        '<td><div style="display:flex;align-items:center;gap:8px;">' +
          '<div class="avatar" style="width:28px;height:28px;font-size:.72rem;">' + initials(u.full_name) + '</div>' +
          escHtml(u.full_name) + '</div></td>' +
        '<td class="t-muted fs-sm">' + escHtml(u.login) + '</td>' +
        '<td>' + statusChip(u.role) + '</td>' +
        '<td class="fs-sm t-muted">' + escHtml(tlName) + '</td>' +
        '<td class="fs-sm">' + escHtml(teamName || '—') + '</td>' +
        '<td>' + statusChip(u.status) + '</td>' +
        '<td><div style="display:flex;gap:6px;">' +
          (canEdit ? '<button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openUserModal(\'' + u.id + '\')">✎</button>' : '') +
          (canToggle ? '<button class="bd fs-xs" style="min-height:30px;padding:0 10px;" onclick="toggleUserStatus(\'' + u.id + '\',\'' + escHtml(u.status) + '\')">' + (u.status === 'Actif' ? 'Désactiver' : 'Activer') + '</button>' : '') +
        '</div></td>' +
        '</tr>';
    }
  );
  html += '</div>';
  el('content').innerHTML = html;
}

/* ── Modal création/édition utilisateur ─────────────────────── */
function openUserModal(userId) {
  var u        = userId ? (_users.find(function(x){ return x.id === userId; }) || {}) : {};
  var isNew    = !userId;
  var myRole   = S.session && S.session.user ? S.session.user.role : '';
  var isAdmin  = myRole === 'super_admin';

  var teams       = (S.lookups && S.lookups.teams)       ? S.lookups.teams       : [];
  var teamLeaders = (S.lookups && S.lookups.teamLeaders) ? S.lookups.teamLeaders : [];

  // TL ne peut créer/modifier que des ambassadeurs
  var roles = isAdmin ? ['ambassador', 'team_leader', 'super_admin'] : ['ambassador'];
  var currentRole = u.role || 'ambassador';

  var html = '<div class="overlay" id="modal-user" onclick="if(event.target===this)closeModal(\'modal-user\')">';
  html += '<div class="modal modal-narrow"><div class="modal-head">';
  html += '<h2>' + (isNew ? (isAdmin ? 'Nouvel utilisateur' : 'Nouvel ambassadeur') : 'Modifier — ' + escHtml(u.full_name || '')) + '</h2>';
  html += '<button class="modal-close" onclick="closeModal(\'modal-user\')">✕</button>';
  html += '</div><div class="modal-body"><div class="grid" style="gap:14px;">';

  html += '<div class="field"><label>Nom complet <span class="req">*</span></label>' +
    '<input type="text" id="u-name" value="' + escHtml(u.full_name || '') + '" placeholder="Prénom Nom"></div>';
  html += '<div class="field"><label>Login <span class="req">*</span></label>' +
    '<input type="text" id="u-login" value="' + escHtml(u.login || '') + '" placeholder="prenom.nom" autocomplete="off"></div>';
  if (isNew) {
    html += '<div class="field"><label>Mot de passe <span class="req">*</span></label>' +
      '<input type="password" id="u-pass" placeholder="••••••••" autocomplete="new-password"></div>';
  }

  // Rôle — admin: tous; TL: ambassadeur uniquement
  html += '<div class="field"><label>Rôle</label><select id="u-role" onchange="onUserRoleChange()"' + (!isAdmin ? ' disabled' : '') + '>';
  roles.forEach(function(r) {
    html += '<option value="' + r + '"' + (currentRole === r ? ' selected' : '') + '>' + r + '</option>';
  });
  html += '</select></div>';

  // Team Leader — affiché pour admin quand rôle = ambassador; auto pour TL
  var showTL = isAdmin ? (currentRole === 'ambassador') : true;
  html += '<div class="field' + (showTL ? '' : ' hidden') + '" id="u-tl-field"><label>Team Leader <span class="req">*</span></label>';
  if (isAdmin) {
    html += '<select id="u-tl"><option value="">— Sélectionner —</option>';
    teamLeaders.forEach(function(tl) {
      html += '<option value="' + tl.id + '"' + (u.team_leader_id === tl.id ? ' selected' : '') + '>' + escHtml(tl.full_name) + '</option>';
    });
    html += '</select>';
  } else {
    // TL voit son propre nom en lecture seule
    var myName = S.session && S.session.user ? S.session.user.full_name : '';
    var myId   = S.session && S.session.user ? S.session.user.id        : '';
    html += '<input type="hidden" id="u-tl" value="' + escHtml(myId) + '">';
    html += '<div class="chip cs" style="display:inline-block;margin-top:2px;">' + escHtml(myName) + ' <span class="t-muted fs-xs">(vous)</span></div>';
  }
  html += '</div>';

  // Équipe — admin seulement
  if (isAdmin) {
    html += '<div class="field"><label>Équipe</label><select id="u-team"><option value="">— Aucune —</option>';
    teams.forEach(function(t) {
      html += '<option value="' + t.id + '"' + (u.team_id === t.id ? ' selected' : '') + '>' + escHtml(t.name) + '</option>';
    });
    html += '</select></div>';
  }

  html += '</div></div><div class="modal-foot">';
  html += '<button class="b3" onclick="closeModal(\'modal-user\')">Annuler</button>';
  html += '<button class="b1 save-btn" id="btn-user-save" onclick="saveUser(\'' + (userId||'') + '\')">';
  html += '<span class="label">Enregistrer</span><span class="spinner hidden"><i></i></span>';
  html += '</button></div></div></div>';

  var prev = el('modal-user');
  if (prev) prev.remove();
  document.body.insertAdjacentHTML('beforeend', html);
  openModal('modal-user');
  setTimeout(function() { var f = el('u-name'); if (f) f.focus(); }, 60);
}

function onUserRoleChange() {
  var role    = el('u-role') ? el('u-role').value : '';
  var tlField = el('u-tl-field');
  if (tlField) tlField.classList.toggle('hidden', role !== 'ambassador');
}

function saveUser(userId) {
  var btn   = el('btn-user-save');
  var name  = el('u-name').value.trim();
  var login = el('u-login').value.trim();
  markRequired('u-name',  !name);
  markRequired('u-login', !login);
  if (!name || !login) { toast('Nom et login obligatoires.', 'error'); return; }

  var payload = {
    id:             userId || '',
    full_name:      name,
    login:          login,
    role:           el('u-role').value,
    team_id:        el('u-team')  ? el('u-team').value  : '',
    team_leader_id: el('u-tl')    ? el('u-tl').value    : ''
  };
  var passEl = el('u-pass');
  if (passEl) payload.password = passEl.value;

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-user');
      var m = el('modal-user');
      if (m) setTimeout(function() { m.remove(); }, 250);
      toast('Utilisateur enregistré.', 'success');
      reload(); // recharge la vue active (Utilisateurs ou Équipes)
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .saveUser(S.token, payload);
}

function toggleUserStatus(userId, currentStatus) {
  var newStatus = currentStatus === 'Actif' ? 'Inactif' : 'Actif';
  google.script.run
    .withSuccessHandler(function() { toast('Statut mis à jour.', 'success'); reload(); })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .saveUser(S.token, { id: userId, status: newStatus });
}

/* ═══ ÉQUIPES ════════════════════════════════════════════════ */
var _teams = [];

function renderTeams() {
  el('content').innerHTML = buildSkeletonTable(4);
  google.script.run
    .withSuccessHandler(paintTeams)
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listTeams(S.token);
}

function paintTeams(rows) {
  _teams = rows || [];
  var myRole  = S.session && S.session.user ? S.session.user.role : '';
  var isAdmin = myRole === 'super_admin';
  var myId    = S.session && S.session.user ? S.session.user.id : '';

  var html = '<div class="card">';
  html += '<div class="card-head"><span class="fw8">Équipes</span>';
  if (isAdmin) {
    html += '<button class="b1" onclick="openTeamModal(null)">+ Nouvelle équipe</button>';
  }
  html += '</div>';

  if (!_teams.length) {
    html += '<div class="empty">Aucune équipe.</div></div>';
    el('content').innerHTML = html;
    return;
  }

  if (isAdmin) {
    /* ── Vue admin : tableau de toutes les équipes ── */
    html += buildTable(
      ['Nom', 'Team Leader', 'Ambassadeurs', 'Dossiers', 'Actions'],
      _teams,
      function(t) {
        return '<tr>' +
          '<td class="fw7">' + escHtml(t.name) + '</td>' +
          '<td class="fs-sm t-muted">' + escHtml(t.team_leader_name || '—') + '</td>' +
          '<td>' + (t.ambassadors_count || 0) + '</td>' +
          '<td>' + (t.agrements_count   || 0) + '</td>' +
          '<td><button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openTeamModal(\'' + t.id + '\')">✎</button></td>' +
          '</tr>';
      }
    );
  } else {
    /* ── Vue TL : sa propre équipe + liste ambassadeurs ── */
    var team = _teams[0];
    if (!team) {
      html += '<div class="empty">Aucune équipe assignée à votre compte.</div></div>';
      el('content').innerHTML = html;
      return;
    }

    // Carte équipe
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">';
    html += '<div class="kpi" style="flex:1;min-width:140px;cursor:default;">';
    html += '<div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Équipe</div>';
    html += '<div class="v" style="font-size:1.2rem;">' + escHtml(team.name) + '</div>';
    html += '</div>';
    html += '<div class="kpi" style="flex:1;min-width:100px;cursor:default;">';
    html += '<div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Ambassadeurs</div>';
    html += '<div class="v">' + (team.ambassadors_count || 0) + '</div>';
    html += '</div>';
    html += '<div class="kpi" style="flex:1;min-width:100px;cursor:default;">';
    html += '<div class="fs-xs t-muted fw7" style="text-transform:uppercase;letter-spacing:.05em;">Dossiers</div>';
    html += '<div class="v">' + (team.agrements_count || 0) + '</div>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;">';
    html += '<button class="b3 fs-xs" style="min-height:36px;padding:0 14px;" onclick="openTeamModal(\'' + team.id + '\')">✎ Modifier l\'équipe</button>';
    html += '</div></div>';

    // Liste des ambassadeurs
    html += '<div class="card-head" style="margin-bottom:12px;padding:0;">';
    html += '<span class="fw7">Mes ambassadeurs</span>';
    html += '<button class="b1" onclick="openUserModal(null)">+ Ajouter ambassadeur</button>';
    html += '</div>';

    // Ambassadeurs depuis lookups (scope déjà filtré par le backend)
    var ambassadors = (S.lookups && S.lookups.users)
      ? S.lookups.users.filter(function(u) {
          return u.role === 'ambassador' && u.team_leader_id === myId;
        })
      : [];

    if (!ambassadors.length) {
      html += '<div class="empty">Aucun ambassadeur dans votre équipe.</div>';
    } else {
      html += buildTable(
        ['Nom', 'Login', 'Statut', 'Actions'],
        ambassadors,
        function(u) {
          return '<tr>' +
            '<td><div style="display:flex;align-items:center;gap:8px;">' +
              '<div class="avatar" style="width:26px;height:26px;font-size:.7rem;">' + initials(u.full_name) + '</div>' +
              escHtml(u.full_name) +
            '</div></td>' +
            '<td class="t-muted fs-sm">' + escHtml(u.login) + '</td>' +
            '<td>' + statusChip(u.status) + '</td>' +
            '<td><div style="display:flex;gap:6px;">' +
              '<button class="b3 fs-xs" style="min-height:30px;padding:0 10px;" onclick="openTLUserEdit(\'' + u.id + '\')">✎</button>' +
              '<button class="bd fs-xs" style="min-height:30px;padding:0 10px;" onclick="toggleUserStatus(\'' + u.id + '\',\'' + escHtml(u.status) + '\')">' + (u.status === 'Actif' ? 'Désactiver' : 'Activer') + '</button>' +
            '</div></td>' +
            '</tr>';
        }
      );
    }
  }

  html += '</div>';
  el('content').innerHTML = html;
}

/* Edition d'un ambassadeur depuis la vue TL (sans nécessiter _users chargé) */
function openTLUserEdit(userId) {
  // Charge les détails de cet utilisateur avant d'ouvrir le modal
  google.script.run
    .withSuccessHandler(function(rows) {
      _users = rows || [];
      openUserModal(userId);
    })
    .withFailureHandler(function(e) { gasFailureHandler(e); })
    .listUsers(S.token, {});
}

/* ── Modal équipe ────────────────────────────────────────────── */
function openTeamModal(teamId) {
  var t       = teamId ? (_teams.find(function(x){ return x.id === teamId; }) || {}) : {};
  var isNew   = !teamId;
  var isAdmin = S.session && S.session.user && S.session.user.role === 'super_admin';
  var teamLeaders = (S.lookups && S.lookups.teamLeaders) ? S.lookups.teamLeaders : [];

  var html = '<div class="overlay" id="modal-team" onclick="if(event.target===this)closeModal(\'modal-team\')">';
  html += '<div class="modal modal-narrow"><div class="modal-head">';
  html += '<h2>' + (isNew ? 'Nouvelle équipe' : 'Modifier — ' + escHtml(t.name || '')) + '</h2>';
  html += '<button class="modal-close" onclick="closeModal(\'modal-team\')">✕</button>';
  html += '</div><div class="modal-body"><div class="grid" style="gap:14px;">';

  html += '<div class="field"><label>Nom de l\'équipe <span class="req">*</span></label>' +
    '<input type="text" id="t-name" value="' + escHtml(t.name || '') + '" placeholder="Ex: Équipe GLI"></div>';

  if (isAdmin) {
    // Admin : assigner un Team Leader
    html += '<div class="field"><label>Team Leader</label><select id="t-tl"><option value="">— Aucun —</option>';
    teamLeaders.forEach(function(tl) {
      html += '<option value="' + tl.id + '"' + (t.team_leader_id === tl.id ? ' selected' : '') + '>' + escHtml(tl.full_name) + '</option>';
    });
    html += '</select></div>';
    // Statut
    html += '<div class="field"><label>Statut</label><select id="t-status">';
    ['Actif', 'Inactif'].forEach(function(s) {
      html += '<option value="' + s + '"' + (( t.status || 'Actif') === s ? ' selected' : '') + '>' + s + '</option>';
    });
    html += '</select></div>';
  }

  html += '</div></div><div class="modal-foot">';
  html += '<button class="b3" onclick="closeModal(\'modal-team\')">Annuler</button>';
  html += '<button class="b1 save-btn" id="btn-team-save" onclick="saveTeam(\'' + (teamId||'') + '\')">';
  html += '<span class="label">Enregistrer</span><span class="spinner hidden"><i></i></span>';
  html += '</button></div></div></div>';

  var prev = el('modal-team');
  if (prev) prev.remove();
  document.body.insertAdjacentHTML('beforeend', html);
  openModal('modal-team');
}

function saveTeam(teamId) {
  var btn  = el('btn-team-save');
  var name = el('t-name').value.trim();
  markRequired('t-name', !name);
  if (!name) { toast('Le nom est obligatoire.', 'error'); return; }

  var payload = {
    id:             teamId || '',
    name:           name,
    team_leader_id: el('t-tl')     ? el('t-tl').value     : '',
    status:         el('t-status') ? el('t-status').value  : 'Actif'
  };

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function() {
      setBtnLoading(btn, false);
      closeModal('modal-team');
      var m = el('modal-team');
      if (m) setTimeout(function() { m.remove(); }, 250);
      toast('Équipe enregistrée.', 'success');
      reload();
    })
    .withFailureHandler(function(e) { gasFailureHandler(e, btn); })
    .saveTeam(S.token, payload);
}
</script>
